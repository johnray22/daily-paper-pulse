name: daily-paper-ai-enhanced

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv sync

      - name: Collect multi-source papers
        id: collect_step
        run: |
          source .venv/bin/activate
          today=$(date -u "+%Y-%m-%d")
          export PAPER_DATE="$today"
          export TOKEN_GITHUB="${{ secrets.TOKEN_GITHUB }}"
          export CATEGORIES="${{ vars.CATEGORIES }}"
          export LANGUAGE="${{ vars.LANGUAGE }}"
          export MODEL_NAME="${{ vars.MODEL_NAME }}"
          export LANGUAGE="${LANGUAGE:-Chinese}"
          export MODEL_NAME="${MODEL_NAME:-GLM-4.7}"

          mkdir -p data assets
          rm -f "data/${today}.jsonl"

          python daily_arxiv/collect_papers.py --config daily_arxiv/config.yaml --output "data/${today}.jsonl"

          if [ ! -f "data/${today}.jsonl" ]; then
            echo "Collection failed: data/${today}.jsonl was not generated"
            exit 1
          fi

          echo "paper_date=$today" >> "$GITHUB_OUTPUT"

      - name: Check for duplicates
        id: dedup_check
        run: |
          source .venv/bin/activate
          today="${{ steps.collect_step.outputs.paper_date }}"
          export PAPER_DATE="$today"

          cd daily_arxiv
          set +e
          python daily_arxiv/check_stats.py
          dedup_exit_code=$?
          set -e

          echo "dedup_exit_code=$dedup_exit_code" >> "$GITHUB_OUTPUT"
          case $dedup_exit_code in
            0)
              echo "has_new_content=true" >> "$GITHUB_OUTPUT"
              ;;
            1)
              echo "has_new_content=false" >> "$GITHUB_OUTPUT"
              echo "skip_reason=no_new_content" >> "$GITHUB_OUTPUT"
              ;;
            2)
              echo "has_new_content=false" >> "$GITHUB_OUTPUT"
              echo "skip_reason=processing_error" >> "$GITHUB_OUTPUT"
              exit 1
              ;;
            *)
              echo "has_new_content=false" >> "$GITHUB_OUTPUT"
              echo "skip_reason=unknown_error" >> "$GITHUB_OUTPUT"
              exit 1
              ;;
          esac

      - name: AI enhancement
        if: steps.dedup_check.outputs.has_new_content == 'true'
        run: |
          source .venv/bin/activate
          today="${{ steps.collect_step.outputs.paper_date }}"
          export OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}"
          export OPENAI_BASE_URL="${{ secrets.OPENAI_BASE_URL }}"
          export TOKEN_GITHUB="${{ secrets.TOKEN_GITHUB }}"
          export LANGUAGE="${{ vars.LANGUAGE }}"
          export MODEL_NAME="${{ vars.MODEL_NAME }}"
          export LANGUAGE="${LANGUAGE:-Chinese}"
          export MODEL_NAME="${MODEL_NAME:-GLM-4.7}"

          cd ai
          python enhance.py --data "../data/${today}.jsonl"

      - name: Convert to Markdown
        if: steps.dedup_check.outputs.has_new_content == 'true'
        run: |
          source .venv/bin/activate
          today="${{ steps.collect_step.outputs.paper_date }}"
          export LANGUAGE="${{ vars.LANGUAGE }}"
          export LANGUAGE="${LANGUAGE:-Chinese}"

          cd to_md
          ai_file="../data/${today}_AI_enhanced_${LANGUAGE}.jsonl"
          if [ ! -f "$ai_file" ]; then
            echo "AI enhanced file not found: $ai_file"
            exit 1
          fi
          python convert.py --data "$ai_file"

      - name: Update file list
        if: steps.dedup_check.outputs.has_new_content == 'true'
        run: |
          ls data/*.jsonl | sed 's|data/||' > assets/file-list.txt

      - name: Generate runtime Pages config
        run: |
          password="${{ secrets.ACCESS_PASSWORD }}"
          if [ -z "$password" ]; then
            password_hash="DISABLED_NO_PASSWORD_SET_IN_SECRETS"
          else
            password_hash=$(echo -n "$password" | openssl dgst -sha256 -hex | awk '{print $2}')
          fi

          repo_owner="${{ github.repository_owner }}"
          repo_name="${{ github.event.repository.name }}"

          sed -i "s/passwordHash: '.*'/passwordHash: '$password_hash'/" js/auth-config.js
          sed -i "s/repoOwner: '.*'/repoOwner: '$repo_owner'/" js/data-config.js
          sed -i "s/repoName: '.*'/repoName: '$repo_name'/" js/data-config.js

      - name: Commit generated config to main
        run: |
          git config --global user.email "${{ vars.EMAIL || 'github-actions[bot]@users.noreply.github.com' }}"
          git config --global user.name "${{ vars.NAME || 'github-actions[bot]' }}"

          git add js/auth-config.js js/data-config.js
          if git diff --staged --quiet; then
            echo "No generated config changes to commit"
          else
            git commit -m "chore: update generated Pages config"
            git pull --rebase origin "${{ github.ref_name }}" || true
            git push origin HEAD:"${{ github.ref_name }}"
          fi

      - name: Prepare data branch payload
        if: steps.dedup_check.outputs.has_new_content == 'true'
        run: |
          mkdir -p /tmp/data_files/data /tmp/data_files/assets
          cp -r data/* /tmp/data_files/data/ 2>/dev/null || true
          cp assets/file-list.txt /tmp/data_files/assets/ 2>/dev/null || true

      - name: Commit data branch
        if: steps.dedup_check.outputs.has_new_content == 'true'
        run: |
          git config --global user.email "${{ vars.EMAIL || 'github-actions[bot]@users.noreply.github.com' }}"
          git config --global user.name "${{ vars.NAME || 'github-actions[bot]' }}"

          today="${{ steps.collect_step.outputs.paper_date }}"
          rm -rf data assets/file-list.txt

          if git ls-remote --heads origin data | grep -q refs/heads/data; then
            git fetch origin data:data
            git checkout data
            git pull --rebase origin data || true
          else
            git checkout --orphan data
            git rm -rf --cached . 2>/dev/null || true
            rm -rf ./* .github 2>/dev/null || true
            echo "# Data Branch" > README.md
            git add README.md
            git commit -m "chore: initialize data branch"
          fi

          mkdir -p data assets
          cp -r /tmp/data_files/data/* data/ 2>/dev/null || true
          cp /tmp/data_files/assets/file-list.txt assets/ 2>/dev/null || true

          git add data/* assets/file-list.txt 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "update: $today papers"
          fi

          git push origin data

      - name: Summary
        run: |
          if [ "${{ steps.dedup_check.outputs.has_new_content }}" = "true" ]; then
            echo "Workflow completed with new papers."
          else
            echo "Workflow completed without new papers: ${{ steps.dedup_check.outputs.skip_reason }}"
          fi
